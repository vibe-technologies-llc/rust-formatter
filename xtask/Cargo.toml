[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[dependencies]
clap = { version = "4.6.9", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
walkdir = "2.5.1"
