[package]
name = "rust-formatter"
version = "0.1.0"
edition = "2024"
default-run = "rust-formatter"
description = "Format Rust and TOML without rustfmt.toml or toolchain changes"
license = "AGPL-3.0-only"
repository = "https://github.com/vibe-technologies-llc/rust-formatter"
readme = "README.md"
keywords = ["rustfmt", "formatter", "toml", "cargo", "fmt"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["fuzz"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Every module is `pub` so the binary can use it; none of it is an API anyone
# depends on, and `lib.rs` makes no stability promise. Annotating several hundred
# internal functions says nothing a caller could act on.
must_use_candidate = "allow"
# One `Error` enum carries every failure, each variant with a stable diagnostic
# code, and `src/error.rs` documents them in one place. An `# Errors` section per
# function would restate that list several dozen times.
missing_errors_doc = "allow"
# `FormatterOptions` and `TomlStyle` are the command line and the style sheet.
# Their flags are booleans because the flags are booleans.
struct_excessive_bools = "allow"

[dependencies]
ahash = "0.8.12"
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
globset = "0.4.20"
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
thiserror = "2.0.21"
toml_edit = { version = "0.25.15", features = ["serde"] }
unicode-width = "0.2.2"
xxhash-rust = { version = "0.8.18", default-features = false, features = ["xxh3"] }
tempfile = "3.27.0"
semver = "1.0.28"
ureq = { version = "3.4.2", features = ["json", "platform-verifier", "socks-proxy"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
notify-debouncer-full = "0.7.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.151"
proptest = "1.11.0"
walkdir = "2.5.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "toml_format"
harness = false

[[bench]]
name = "walk"
harness = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"
